<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ember (Stuyk): when you want results, you call me.</title>
<meta name="hypedoc:width" content="960">
<meta name="hypedoc:selector" content="#card">
<style>
  :root { --cream:#f3efe6; --sand:#dad6ca; --plum:#4a3040; --teal:#45aecd; --ink:#2b1c26; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--plum); }
  #card { padding: 20px 28px 32px 20px; }
  .box {
    position: relative; background-color: var(--cream);
    border: 3px solid var(--plum); border-radius: 14px; box-shadow: 10px 10px 0 var(--plum);
    padding: 52px 52px 48px; display: grid; grid-template-columns: 1fr 200px; gap: 40px; align-items: end;
    overflow: hidden;
  }
  .plus { z-index: 0; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(90deg, transparent 23px, #e3ddcf 23px, #e3ddcf 25px, transparent 25px),
      linear-gradient(transparent 23px, #e3ddcf 23px, #e3ddcf 25px, transparent 25px);
    background-size: 48px 48px; opacity:.9;
    -webkit-mask-image: radial-gradient(circle at 24px 24px, #000 7px, transparent 7.5px);
    -webkit-mask-size: 48px 48px; }
  .content, .stats { position: relative; }
  .tag { display:inline-block; font: 700 13px/1 "Go Mono", ui-monospace, monospace; letter-spacing: .18em;
    background: var(--teal); border: 2px solid var(--plum); padding: 6px 9px; margin-bottom: 18px; color: var(--ink); }
  h1 { margin: 0 0 20px; font-family: "Inter Display", Inter, sans-serif; font-weight: 900; font-size: 76px; line-height: .95; letter-spacing: -0.045em; color: var(--plum); }
  p { margin: 0 0 26px; font-size: 18px; line-height: 1.55; color: #4f3a47; max-width: 520px; }
  .stats { display: flex; flex-direction: column; gap: 16px; }
  .stat { background: var(--cream); border: 2.5px solid var(--plum); border-radius: 8px; box-shadow: 4px 4px 0 var(--plum);
    padding: 10px 14px; min-width: 112px; }
  .stat:nth-child(1) { background: var(--teal); }
  .stat:nth-child(3) { background: var(--sand); }
  .stat b { display:block; font-family:"Inter Display", Inter, sans-serif; font-weight: 900; font-size: 28px; letter-spacing: -0.03em; line-height: 1; }
  .stat span { font: 700 11px/1 "Go Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="card">
  <div class="box">
    <div class="plus"></div>
    <div class="content">
      <div class="tag">EMBER · @STUYK</div>
      <h1>When you<br>want results,<br>you call me.</h1>
      <p>Years shipping across blockchain, fintech, and game development. Give me the mess nobody wants to touch and I'll find where it's broken.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>11 yrs</b><span>Shipping</span></div>
      <div class="stat"><b>220+</b><span>Public repos</span></div>
      <div class="stat"><b>150+</b><span>Videos taught</span></div>
    </div>
  </div>
</div>
</body>
</html>
